<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project We</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a2e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a4a;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #7c8aff;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            background: #2a2a4a;
            color: #e0e0e0;
            border: 1px solid #3a3a5a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        select:hover, button:hover { border-color: #7c8aff; }

        .sos-btn {
            background: #d32f2f;
            border-color: #d32f2f;
            color: white;
            font-weight: 700;
            padding: 6px 14px;
        }

        .sos-btn:hover { background: #b71c1c; }
        .voice-btn {
            background: #455a64;
            border-color: #455a64;
            color: #fff;
            font-weight: 600;
        }

        .voice-btn.active {
            background: #00897b;
            border-color: #00897b;
        }

        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background: #1a1a2e;
            border-right: 1px solid #2a2a4a;
            padding: 12px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bot-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 0.85rem;
            transition: background 0.15s;
        }

        .bot-item:hover { background: #2a2a4a; }
        .bot-item.active { background: #3a3a6a; color: #7c8aff; }

        .bot-sector {
            font-size: 0.7rem;
            color: #666;
            margin-top: 2px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.9rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: #3a3a6a;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e1e3a;
            color: #d0d0d0;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: #2a2a2a;
            color: #ffab40;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .message .permission-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            border: none;
        }

        .approve-btn { background: #4caf50; color: white; }
        .deny-btn { background: #f44336; color: white; margin-left: 6px; }

        .typing {
            align-self: flex-start;
            color: #888;
            font-size: 0.85rem;
            padding: 8px 14px;
        }

        .typing::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .input-area {
            padding: 12px 20px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #0f0f0f;
            border: 1px solid #3a3a5a;
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .input-area input:focus { border-color: #7c8aff; }

        .send-btn {
            background: #7c8aff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .send-btn:hover { background: #6b7aee; }
        .send-btn:disabled { background: #3a3a5a; cursor: not-allowed; }

        .status-bar {
            background: #0a0a1a;
            padding: 4px 20px;
            font-size: 0.7rem;
            color: #555;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 4px;
        }

        .search-badge {
            display: inline-block;
            background: #1b5e20;
            color: #a5d6a7;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        @media (max-width: 700px) {
            .sidebar { display: none; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Project We</div>
        <div class="controls">
            <select id="modelSelect">
                <option value="">Default (llama3)</option>
                <option value="deepseek-r1:8b">DeepSeek R1 (reasoning)</option>
                <option value="qwen2.5:1.5b">Qwen 2.5 (fast)</option>
                <option value="qwen2.5:7b">Qwen 2.5 7B</option>
            </select>
            <button id="voiceBtn" class="voice-btn" onclick="toggleVoice()">Voice Off</button>
            <button class="sos-btn" onclick="triggerSOS()">SOS</button>
        </div>
    </header>

    <div class="main-area">
        <div class="sidebar">
            <h3>Bots</h3>
            <div id="botList">
                <div class="bot-item active" data-slug="" onclick="switchBot(this, '')">
                    <div>Main Assistant</div>
                    <div class="bot-sector">general</div>
                </div>
            </div>
            <button style="width:100%; margin-top:10px; font-size:0.8rem;" onclick="showCreateBot()">+ New Bot</button>
        </div>

        <div class="chat-area">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span><span class="status-dot"></span> Running locally</span>
        <span id="statusInfo">Model: llama3:8b | Voice: off | Port: 8001</span>
    </div>

    <script>
        const API = window.location.origin;
        let currentBot = '';
        let pendingPermission = null;
        let voiceActive = false;

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            addMessage('user', msg);
            showTyping();

            const model = document.getElementById('modelSelect').value || null;
            const body = { message: msg };
            if (model) body.model = model;
            if (pendingPermission) {
                body.permission_id = pendingPermission;
                pendingPermission = null;
            }

            try {
                let url, options;
                if (currentBot) {
                    url = `${API}/specialists/${currentBot}/chat`;
                } else {
                    url = `${API}/chat`;
                }

                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                hideTyping();

                if (!resp.ok) {
                    const err = await resp.json();
                    addMessage('system', `Error: ${err.detail || resp.statusText}`);
                    return;
                }

                const data = await resp.json();

                if (data.requires_permission) {
                    addPermissionMessage(data.response, data.permission_request_id);
                } else if (data.search_results_used) {
                    addMessage('assistant', data.response, true);
                } else {
                    addMessage('assistant', data.response || data.response);
                }
            } catch (e) {
                hideTyping();
                addMessage('system', `Connection error: ${e.message}`);
            }
        }

        function addMessage(role, content, searched = false) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (searched) {
                div.innerHTML = `<span class="search-badge">Web Search</span><br>${escapeHtml(content)}`;
            } else {
                div.textContent = content;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addPermissionMessage(text, permId) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `
                ${escapeHtml(text)}
                <br>
                <button class="permission-btn approve-btn" onclick="approvePermission(${permId})">Allow Internet</button>
                <button class="permission-btn deny-btn" onclick="denyPermission(${permId})">Deny</button>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function approvePermission(permId) {
            await fetch(`${API}/permissions/${permId}/decision`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approve: true }),
            });
            pendingPermission = permId;
            addMessage('system', 'Internet access approved. Send your question again.');
        }

        async function denyPermission(permId) {
            await fetch(`${API}/permissions/${permId}/decision`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approve: false }),
            });
            addMessage('system', 'Internet access denied.');
        }

        function showTyping() {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typingIndicator';
            div.textContent = 'Thinking';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            document.getElementById('sendBtn').disabled = true;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
            document.getElementById('sendBtn').disabled = false;
        }

        function switchBot(el, slug) {
            document.querySelectorAll('.bot-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentBot = slug;
            document.getElementById('messages').innerHTML = '';
            const name = el.querySelector('div').textContent;
            addMessage('system', `Switched to ${name}`);
        }

        async function loadBots() {
            try {
                const resp = await fetch(`${API}/specialists`);
                const bots = await resp.json();
                const list = document.getElementById('botList');

                bots.forEach(bot => {
                    const div = document.createElement('div');
                    div.className = 'bot-item';
                    div.dataset.slug = bot.slug;
                    div.onclick = () => switchBot(div, bot.slug);
                    div.innerHTML = `<div>${bot.name}</div><div class="bot-sector">${bot.sector}</div>`;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error('Failed to load bots:', e);
            }
        }

        function showCreateBot() {
            const name = prompt('Bot name:');
            if (!name) return;
            const sector = prompt('Sector (e.g., finance, tech, health):');
            if (!sector) return;
            const sysPrompt = prompt('System prompt (what should this bot specialize in):');
            if (!sysPrompt) return;

            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

            fetch(`${API}/specialists`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    slug: slug,
                    name: name,
                    sector: sector,
                    system_prompt: sysPrompt,
                    description: `${name} specialist`,
                }),
            })
            .then(r => r.json())
            .then(bot => {
                if (bot.id) {
                    const list = document.getElementById('botList');
                    const div = document.createElement('div');
                    div.className = 'bot-item';
                    div.dataset.slug = bot.slug;
                    div.onclick = () => switchBot(div, bot.slug);
                    div.innerHTML = `<div>${bot.name}</div><div class="bot-sector">${bot.sector}</div>`;
                    list.appendChild(div);
                    addMessage('system', `Created bot: ${bot.name}`);
                } else {
                    addMessage('system', `Error: ${bot.detail || 'Could not create bot'}`);
                }
            })
            .catch(e => addMessage('system', `Error: ${e.message}`));
        }

        async function triggerSOS() {
            if (!confirm('EMERGENCY STOP - This will shut down all bot activity. Continue?')) return;
            await fetch(`${API}/safety/sos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason: 'User triggered SOS from UI' }),
            });
            addMessage('system', 'EMERGENCY STOP ACTIVATED. All operations halted.');
            document.getElementById('sendBtn').disabled = true;
        }

        async function refreshVoiceStatus() {
            try {
                const resp = await fetch(`${API}/voice/status`);
                if (!resp.ok) return;
                const data = await resp.json();
                voiceActive = data.active;
                const btn = document.getElementById('voiceBtn');
                btn.textContent = voiceActive ? 'Voice On' : 'Voice Off';
                btn.classList.toggle('active', voiceActive);
                const status = document.getElementById('statusInfo');
                status.textContent = `Model: llama3:8b | Voice: ${voiceActive ? 'listening' : 'off'} | Port: 8001`;
            } catch (e) {
                // no-op
            }
        }

        async function toggleVoice() {
            const endpoint = voiceActive ? '/voice/stop' : '/voice/start';
            const resp = await fetch(`${API}${endpoint}`, { method: 'POST' });
            if (!resp.ok) {
                const err = await resp.json();
                addMessage('system', `Voice error: ${err.detail || 'failed to toggle voice'}`);
                return;
            }
            await refreshVoiceStatus();
            addMessage('system', voiceActive ? 'Voice mode enabled (wake word: Ducus)' : 'Voice mode disabled');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load bots on startup
        loadBots();
        refreshVoiceStatus();
        setInterval(refreshVoiceStatus, 5000);
        addMessage('system', 'Welcome to Project We. Your AI assistant is running locally.');
    </script>
</body>
</html>
