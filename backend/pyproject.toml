[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-we-backend"
version = "0.2.0"
description = "Project We backend foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
# Core mic packages. onnxruntime / faster-whisper often lack Python 3.14 wheels —
# install them separately when your Python version supports them (3.11–3.12 best).
voice = [
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
]
voice-stt = [
    "project-we-backend[voice]",
    "faster-whisper>=1.0.0",
]
voice-onnx = [
    "onnxruntime>=1.10.0,<2",
]
voice-full = [
    "project-we-backend[voice,voice-stt,voice-onnx]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
